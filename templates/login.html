<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — RKart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1120; --ink-2:#111a2e; --ink-3:#182238;
    --line:rgba(255,255,255,0.08);
    --text:#EDEFF5; --text-dim:#9AA4BD;
    --gold:#D4A54E; --gold-soft:rgba(212,165,78,0.14);
    --danger:#E8654F; --danger-soft:rgba(232,101,79,0.12);
    --radius:16px; --serif:'Fraunces', serif; --sans:'Manrope', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh; display:flex; flex-direction:column;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(212,165,78,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(45,212,191,0.08), transparent 55%),
      var(--ink);
    color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  header{padding:18px 28px; border-bottom:1px solid var(--line);}
  .brand-logo{
    display:inline-flex; align-items:center; gap:9px;
    font-family:var(--serif); font-size:23px; font-weight:700;
    padding:5px 12px 5px 6px; border-radius:10px;
    background:linear-gradient(135deg, rgba(212,165,78,0.16), rgba(212,165,78,0.02));
    border:1px solid rgba(212,165,78,0.28);
  }
  .brand-logo .dot{width:9px; height:9px; border-radius:50%; background:var(--gold); box-shadow:0 0 14px var(--gold); margin-right:2px;}
  .brand-logo .rk{color:var(--gold);}
  .brand-logo .art{color:var(--text);}

  .center{flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;}
  .auth-card{
    width:100%; max-width:400px; background:var(--ink-2); border:1px solid var(--line);
    border-radius:var(--radius); padding:34px 30px; box-shadow:0 20px 60px -20px rgba(0,0,0,0.6);
  }
  .auth-card h1{font-family:var(--serif); font-size:24px; font-weight:600; margin-bottom:6px;}
  .auth-card .sub{color:var(--text-dim); font-size:14px; margin-bottom:26px;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px;}
  .field input{
    width:100%; background:var(--ink-3); border:1px solid var(--line); border-radius:9px;
    padding:11px 13px; color:var(--text); font-family:var(--sans); font-size:14.5px; outline:none;
  }
  .field input:focus{border-color:var(--gold);}

  .row{display:flex; align-items:center; justify-content:space-between; margin:16px 0 22px; font-size:13px;}
  .row label{display:flex; align-items:center; gap:7px; color:var(--text-dim);}

  button.submit{
    width:100%; background:linear-gradient(135deg, var(--gold), #b9863a);
    color:#1a1204; font-weight:700; font-size:15px; border:none;
    padding:13px; border-radius:9px; cursor:pointer; transition:transform .15s ease;
  }
  button.submit:hover{transform:translateY(-1px);}

  .switch{text-align:center; margin-top:20px; font-size:13.5px; color:var(--text-dim);}
  .switch a{color:var(--gold); font-weight:600;}

  .flash{
    background:var(--danger-soft); border:1px solid rgba(232,101,79,0.35); color:#ffb4a8;
    padding:11px 14px; border-radius:9px; font-size:13.5px; margin-bottom:18px;
  }
</style>
</head>
<body>

<header>
  <a href="/" class="brand-logo"><span class="dot"></span><span class="rk">RK</span><span class="art">art</span></a>
</header>

<div class="center">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to save products, compare, and pick up where you left off.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="row">
        <label><input type="checkbox" name="remember"> Remember me</label>
      </div>
      <button type="submit" class="submit">Login</button>
    </form>

    <p class="switch">New to RKart? <a href="/signup">Create Account</a></p>
  </div>
</div>

</body>
</html>
